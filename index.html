<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Link Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(18, 24, 38, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #a855f7 0%, #d946ef 50%, #f59e0b 100%);
            --accent-purple: #a855f7;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .img-link-box {
            width: 100%;
            max-width: 560px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
        }
        .title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .gradient-text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .drop-area {
            margin-top: 16px;
            border: 2px dashed rgba(168, 85, 247, 0.5);
            background: rgba(168, 85, 247, 0.06);
            border-radius: 16px;
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .drop-area:hover, .drop-area.dragover {
            border-color: var(--accent-gold);
            background: rgba(168, 85, 247, 0.14);
        }
        .btn-grad {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-glass {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid var(--border-glass);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .link-list {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 360px;
            overflow-y: auto;
        }
        .link-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 12px;
        }
        .link-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .link-input {
            flex: 1;
            background: #060911;
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 7px 10px;
            color: #e2e8f0;
            font-size: 0.75rem;
            font-family: monospace;
            outline: none;
        }
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #131b2e;
            border: 1px solid var(--accent-purple);
            color: #fff;
            padding: 9px 18px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <!-- IMAGE TO LINK SECTION -->
    <section class="img-link-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h2 class="title"><i class="fa-solid fa-link gradient-text"></i> Image <span class="gradient-text">To Link</span></h2>
                <p style="font-size:0.8rem; color:var(--text-secondary);">Select ya drag karke kisi bhi image ka direct link banayein</p>
            </div>
            <button id="copyAllBtn" class="btn-grad" style="display:none;" onclick="copyAllLinks()">
                <i class="fa-regular fa-copy"></i> Copy All
            </button>
        </div>

        <!-- Upload Dropzone -->
        <div class="drop-area" id="dropArea" onclick="document.getElementById('imgPicker').click()">
            <i class="fa-solid fa-cloud-arrow-up gradient-text" style="font-size:2.3rem; margin-bottom:10px;"></i>
            <div style="font-size:0.95rem; font-weight:700;">Click to Select Images or Drag & Drop</div>
            <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:4px;">Supports Single & Multiple Photos (JPG, PNG, WEBP)</div>
            <input type="file" id="imgPicker" accept="image/*" multiple style="display:none;" onchange="handleImageFiles(this.files)">
        </div>

        <!-- Generated Links Output -->
        <div class="link-list" id="generatedLinksList"></div>
    </section>

    <div id="toast"></div>

    <script>
        let generatedImages = [];

        const dropArea = document.getElementById('dropArea');
        ['dragenter', 'dragover'].forEach(evt => {
            dropArea.addEventListener(evt, e => { e.preventDefault(); dropArea.classList.add('dragover'); });
        });
        ['dragleave', 'drop'].forEach(evt => {
            dropArea.addEventListener(evt, e => { e.preventDefault(); dropArea.classList.remove('dragover'); });
        });
        dropArea.addEventListener('drop', e => {
            if (e.dataTransfer.files.length) handleImageFiles(e.dataTransfer.files);
        });

        function handleImageFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 900;
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
                        else if (h > MAX) { w *= MAX / h; h = MAX; }
                        canvas.width = Math.round(w);
                        canvas.height = Math.round(h);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

                        const linkData = canvas.toDataURL('image/jpeg', 0.82);
                        const kb = (new Blob([linkData]).size / 1024).toFixed(1);

                        generatedImages.unshift({
                            name: file.name,
                            link: linkData,
                            size: kb + ' KB'
                        });
                        renderLinks();
                        showToast('✅ Image link generated!');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            document.getElementById('imgPicker').value = '';
        }

        function renderLinks() {
            const list = document.getElementById('generatedLinksList');
            const copyAllBtn = document.getElementById('copyAllBtn');
            copyAllBtn.style.display = generatedImages.length > 1 ? 'inline-flex' : 'none';

            list.innerHTML = generatedImages.map((item, idx) => `
                <div class="link-card">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${item.link}" style="width:48px; height:48px; border-radius:8px; object-fit:cover; background:#000;">
                        <div style="min-width:0; flex:1;">
                            <div style="font-size:0.84rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
                            <div style="font-size:0.72rem; color:var(--accent-green); font-weight:600;">Ready • ${item.size}</div>
                        </div>
                        <button class="btn-glass" title="Preview Image" onclick="previewImage(${idx})">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="link-row">
                        <input type="text" class="link-input" value="${item.link}" readonly>
                        <button class="btn-grad" onclick="copySingleLink(${idx})">
                            <i class="fa-regular fa-copy"></i> Copy Link
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function copySingleLink(idx) {
            navigator.clipboard.writeText(generatedImages[idx].link).then(() => {
                showToast('📋 Image link copied!');
            });
        }

        function copyAllLinks() {
            const all = generatedImages.map(i => i.link).join('\n');
            navigator.clipboard.writeText(all).then(() => {
                showToast(`📋 All ${generatedImages.length} links copied!`);
            });
        }

        function previewImage(idx) {
            const item = generatedImages[idx];
            const win = window.open();
            win.document.write(`
                <body style="margin:0; background:#0b0f19; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; color:#fff; font-family:sans-serif;">
                    <img src="${item.link}" style="max-width:92%; max-height:82vh; border-radius:12px;">
                    <a href="${item.link}" download="${item.name}" style="margin-top:14px; background:#a855f7; color:#fff; padding:10px 20px; border-radius:10px; text-decoration:none; font-weight:700;">Download Image</a>
                </body>
            `);
            win.document.close();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2500);
        }
    </script>
</body>
</html>
